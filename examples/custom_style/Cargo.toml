[package]
name = "custom_style"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.92"
publish = false

[lints]
workspace = true


[package.metadata.cargo-machete]
ignored = ["image"] # We need the .png feature


[dependencies]
eframe = { git = "https://github.com/emilk/egui", branch = "main", features = [
  "default",
  "__screenshot", # __screenshot is so we can dump a screenshot using EFRAME_SCREENSHOT_TO
] }
env_logger = { workspace = true, features = ["auto-color", "humantime"] }
egui_demo_lib = { git = "https://github.com/emilk/egui", branch = "main"}
egui_extras = { git = "https://github.com/emilk/egui", branch = "main", features = ["image"] }
image = { workspace = true, features = ["png"] }
